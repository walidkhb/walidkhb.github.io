<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Train Speed</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1418; --panel: #16212a; --line: #26343f;
    --fg: #e9f1f5; --muted: #8499a6; --accent: #ffb020; --ok: #4cd19a; --bad: #ff6b5e;
  }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light;
      --bg: #f2f5f7; --panel: #ffffff; --line: #d5dde3;
      --fg: #10202b; --muted: #5b6f7c; --accent: #b86a00; --ok: #0d8a5a; --bad: #c8301f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; gap: 16px;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: 520px; margin-inline: auto;
  }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; margin: 0; color: var(--muted); font-weight: 600; }
  #status { font-size: 13px; display: flex; align-items: center; gap: 6px; color: var(--muted); }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  #dot.ok { background: var(--ok); } #dot.bad { background: var(--bad); }
  #dot.wait { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { #dot.wait { animation: none; } }

  .dial { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 200px; text-align: center; }
  #speed { font-size: clamp(96px, 34vw, 190px); font-weight: 700; line-height: .95; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  #unit { font-size: 20px; color: var(--accent); font-weight: 600; letter-spacing: .08em; margin-top: 6px; }
  #msg { color: var(--muted); font-size: 13px; margin-top: 10px; min-height: 1.4em; max-width: 34ch; }
  #msg.err { color: var(--bad); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .cell { background: var(--panel); padding: 12px 14px; min-width: 0; }
  .cell b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .cell span { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .wide { grid-column: 1 / -1; }
  .wide b { font-size: 16px; font-family: ui-monospace, Menlo, Consolas, monospace; overflow-wrap: anywhere; }

  .row { display: flex; gap: 10px; }
  button { flex: 1; font: inherit; font-weight: 600; padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1a1200; }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Train Speed</h1>
  <div id="status"><i id="dot"></i><span id="stxt">Stopped</span></div>
</header>

<div class="dial">
  <div id="speed">--</div>
  <div id="unit">KM/H</div>
  <div id="msg">Tap Start and allow location access.</div>
</div>

<div class="grid">
  <div class="cell"><b id="max">--</b><span>Max</span></div>
  <div class="cell"><b id="avg">--</b><span>Average</span></div>
  <div class="cell"><b id="dist">0.00</b><span id="distL">Distance km</span></div>
  <div class="cell"><b id="time">00:00</b><span>Trip time</span></div>
  <div class="cell"><b id="acc">--</b><span>GPS accuracy</span></div>
  <div class="cell"><b id="alt">--</b><span>Altitude</span></div>
  <div class="cell wide"><b id="pos">--</b><span>Latitude, Longitude</span></div>
</div>

<div class="row">
  <button id="go" class="primary">Start</button>
  <button id="units">Switch to mph</button>
  <button id="reset">Reset</button>
</div>

<script>
const $ = id => document.getElementById(id);
let watchId = null, wake = null, mph = false;
let last = null, curMs = null, maxMs = 0, distM = 0, startT = null, timer = null;

const R = 6371000, rad = d => d * Math.PI / 180;
function haversine(a, b) {
  const dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const conv = ms => ms * (mph ? 2.23694 : 3.6);

function render() {
  $('unit').textContent = mph ? 'MPH' : 'KM/H';
  $('units').textContent = mph ? 'Switch to km/h' : 'Switch to mph';
  $('distL').textContent = mph ? 'Distance mi' : 'Distance km';
  $('speed').textContent = curMs == null ? '--' : Math.round(conv(curMs));
  $('max').textContent = maxMs ? Math.round(conv(maxMs)) : '--';
  $('dist').textContent = (distM / (mph ? 1609.344 : 1000)).toFixed(2);
  const secs = startT ? (Date.now() - startT) / 1000 : 0;
  $('avg').textContent = secs > 5 && distM > 0 ? Math.round(conv(distM / secs)) : '--';
  const s = Math.floor(secs), p = n => String(n).padStart(2, '0');
  $('time').textContent = (s >= 3600 ? Math.floor(s / 3600) + ':' : '') + p(Math.floor(s / 60) % 60) + ':' + p(s % 60);
}

function setStatus(cls, txt) { $('dot').className = cls; $('stxt').textContent = txt; }
function msg(t, err) { $('msg').textContent = t; $('msg').className = err ? 'err' : ''; }

function onFix(p) {
  const c = p.coords, now = { lat: c.latitude, lon: c.longitude, t: p.timestamp };
  if (!startT) startT = Date.now();
  $('pos').textContent = c.latitude.toFixed(6) + ', ' + c.longitude.toFixed(6);
  $('acc').textContent = '±' + Math.round(c.accuracy) + ' m';
  $('alt').textContent = c.altitude == null ? '--' : Math.round(c.altitude) + ' m';

  let ms = (c.speed != null && c.speed >= 0) ? c.speed : null;
  if (last) {
    const d = haversine(last, now), dt = (now.t - last.t) / 1000;
    if (dt > 0) {
      if (ms == null && dt >= 0.5) ms = d / dt;          // fallback: compute from positions
      if (c.accuracy <= 50 && d > Math.min(c.accuracy, 10) / 2) distM += d;
    }
  }
  last = now;

  if (c.accuracy > 100) { setStatus('wait', 'Weak signal'); msg('Weak GPS signal. Move closer to a window.'); }
  else { setStatus('ok', 'GPS locked'); msg(''); }

  if (ms != null && c.accuracy <= 100) {
    if (ms < 0.5) ms = 0;                                  // ignore jitter when standing still
    curMs = ms;
    if (ms > maxMs && ms < 140) maxMs = ms;                // cap at ~500 km/h to drop glitches
  }
  render();
}

function onErr(e) {
  if (e.code === 1) { stop(); setStatus('bad', 'Blocked'); msg('Location permission denied. Allow location for this page in your browser settings, then tap Start.', true); }
  else if (e.code === 2) { setStatus('wait', 'No signal'); msg('No GPS signal. Sit near a window; tunnels will interrupt it.'); }
  else { setStatus('wait', 'Searching'); msg('Still searching for satellites…'); }
}

async function start() {
  if (!('geolocation' in navigator)) { setStatus('bad', 'Unsupported'); msg('This browser has no location support.', true); return; }
  if (!window.isSecureContext) { setStatus('bad', 'Not secure'); msg('Location only works over https://. Open this page from an https address.', true); return; }
  setStatus('wait', 'Searching'); msg('Waiting for GPS fix…');
  watchId = navigator.geolocation.watchPosition(onFix, onErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 });
  timer = setInterval(render, 1000);
  $('go').textContent = 'Stop'; $('go').classList.remove('primary');
  try { wake = await navigator.wakeLock.request('screen'); } catch (_) {}
}
function stop() {
  if (watchId != null) navigator.geolocation.clearWatch(watchId);
  watchId = null; clearInterval(timer); last = null; curMs = null;
  if (wake) { wake.release().catch(() => {}); wake = null; }
  $('go').textContent = 'Start'; $('go').classList.add('primary');
  setStatus('', 'Stopped'); render();
}

$('go').onclick = () => watchId == null ? start() : stop();
$('units').onclick = () => { mph = !mph; render(); };
$('reset').onclick = () => { maxMs = 0; distM = 0; startT = watchId != null ? Date.now() : null; render(); };
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && watchId != null) { try { wake = await navigator.wakeLock.request('screen'); } catch (_) {} }
});
render();
</script>
</body>
</html>
