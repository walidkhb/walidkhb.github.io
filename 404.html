<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-CM7GZQSLWB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-CM7GZQSLWB');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Waleed Albadawi</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to Waleed Albadawi's enterprise technology leadership portfolio.">
  <meta name="robots" content="noindex">
  <!-- This page is served for any missing path, at any depth, so every URL here must be absolute. -->
  <noscript><meta http-equiv="refresh" content="8; url=/"></noscript>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/img/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/favicon-192.png">
  <link rel="apple-touch-icon" href="/assets/img/favicon-192.png">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .error-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .error-page h1 { font-size: 6rem; color: var(--color-border); margin-bottom: 1rem; }
    .error-page__links { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; }
    .error-page__redirect { margin-top: 2rem; font-size: 0.875rem; color: var(--color-text-muted); }
    .error-page__redirect a { color: var(--color-text-secondary); }
  </style>
</head>
<body>
  <section class="error-page">
    <div class="container">
      <h1>404</h1>
      <h2 class="mb-3">Page not found.</h2>
      <p class="lead mb-4">The page you're looking for doesn't exist or has been moved.</p>
      <div class="error-page__links">
        <a href="/" class="btn btn--primary">Back to Home</a>
        <a href="/blog.html" class="btn btn--outline">Insights</a>
        <a href="/contact.html" class="btn btn--outline">Contact</a>
      </div>
      <p class="error-page__redirect" id="redirect-note">
        Redirecting to the home page in <span id="countdown">8</span> seconds —
        <a href="/">go now</a>.
      </p>
    </div>
  </section>

  <script>
    (function () {
      var seconds = 8;
      var counter = document.getElementById('countdown');

      var tick = setInterval(function () {
        seconds -= 1;
        if (counter) counter.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(tick);
          // replace(), not assign(), so Back doesn't return here and redirect again
          window.location.replace('/');
        }
      }, 1000);

      // Stop the redirect if the visitor is doing something on the page
      ['click', 'keydown', 'touchstart'].forEach(function (evt) {
        document.addEventListener(evt, function () {
          clearInterval(tick);
          var note = document.getElementById('redirect-note');
          if (note) note.hidden = true;
        }, { once: true });
      });
    })();
  </script>
</body>
</html>
